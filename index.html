*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}

.cats{padding-top:0}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

function exportData(){try{var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hot-list-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}catch(e){status('Couldn’t create the backup file.')}}
function cities(){openSheet('<h3>Cities</h3><div style="margin-top:10px">'+S.cities.map(function(c){return '<button class="item plain" data-act="city" data-v="'+c.id+'"><b>'+esc(c.name)+'</b><small>'+c.places.length+' places'+(c.id===ui.city?' · showing now':'')+'</small></button>'}).join('')+'</div><form id="cf"><label for="cn">Start a new city</label><input class="f" id="cn" required placeholder="Paris, Dubai, New York"><div class="acts"><button class="btn pri" type="submit">Add city</button></div></form>');
  $('#cf').addEventListener('submit',function(e){e.preventDefault();var n=$('#cn').value.trim();if(!n)return;var id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36);var c={id:id,name:n,center:null,areas:[],places:[]};S.cities.push(c);ui.city=id;ui.near=null;ui.sel=null;ui.cat=ui.ty=ui.vb=ui.ar='all';save();closeSheet();render();
    geocode(n,function(r){if(r){c.center=r.ll;save();M.city=null;if(ui.city===id)render()}})})}
function copy(id,btn){var t=$('#'+id).textContent;function ok(){btn.textContent='Copied'}function no(){var r=document.createRange();r.selectNodeContents($('#'+id));var s=window.getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected. Press copy'}
  try{navigator.clipboard.writeText(t).then(ok,no)}catch(e){no()}}

/* ---------- events ---------- */
var delArm=null;
app.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,v=t.dataset.v,p;
  if(a==='tab'){ui.tab=v;render()}
  else if(a==='pickf'){ui.cat=ui.ty=ui.vb=ui.ar='all';ui.q='';ui[t.dataset.k]=v;ui.grp='cat';ui.tab='list';render()}
  else if(a==='seeall'){ui.cat=ui.ty=ui.vb=ui.ar='all';ui.grp=v;if(v==='dist')startGeo();ui.tab='list';render()}
  else if(a==='gosearch'){ui.tab='list';render();var qe=$('#q');if(qe)qe.focus()}
  else if(a==='geo'){startGeo();t.querySelector('small').textContent='Finding you… Allow location when your browser asks.'}
  else if(a==='set'){var k=t.dataset.k;ui[k]=ui[k]===v?'all':v;var fs=ui.fs;render();if(fs)filtersSheet()}
  else if(a==='clearf'){ui.cat=ui.ty=ui.vb=ui.ar='all';var f2=ui.fs;render();if(f2)filtersSheet()}
  else if(a==='filters')filtersSheet()
  else if(a==='grp'){ui.grp=v;if(v==='dist')startGeo();render()}
  else if(a==='near'){if(v==='me'){startGeo();ui.near=ui.near==='me'?null:'me'}else{v=+v;ui.near=ui.near===v?null:v}ui.sel=null;vMap();var pt=nearPt();if(pt)goTo(pt.ll,15,2300);else if(ui.near==null){if(G.ready)gView(city());else fit()}}
  else if(a==='pin'){if(moved>8)return;ui.sel=v;layout();tray()}
  else if(a==='zin'||a==='zout'){zoomAt(M.w/2,M.h/2,a==='zin'?1.5:1/1.5);layout()}
  else if(a==='zfit'){ui.near=null;vMap();fit()}
  else if(a==='open')profile(v)
  else if(a==='reserve')reserve(v)
  else if(a==='brief')brief(v)
  else if(a==='copy')copy(v,t)
  else if(a==='close'){closeSheet();if(ui.tab==='map'){if(G.ready)gSel();else layout();tray()}}
  else if(a==='showmap'){p=find(v);closeSheet();ui.tab='map';ui.near=null;ui.cat=ui.ty=ui.vb=ui.ar='all';ui.sel=v;render();goTo(p.ll,16,1500)}
  else if(a==='must'||a==='been'){p=find(v);p[a]=p[a]?undefined:true;save();render();profile(v)}
  else if(a==='edit')form(v)
  else if(a==='add')form(null)
  else if(a==='findg')findG()
  else if(a==='del'){if(delArm!==v){delArm=v;t.textContent='Tap again to remove';return}delArm=null;var c=city();c.places=c.places.filter(function(x){return x.id!==v});ui.sel=null;save();closeSheet();render()}
  else if(a==='cities')cities()
  else if(a==='city'){ui.city=v;ui.near=null;ui.sel=null;ui.cat=ui.ty=ui.vb=ui.ar='all';ui.q='';closeSheet();render()}
  else if(a==='settings')settings()
  else if(a==='savekey'){var k2=$('#gk').value.trim();if(!k2)return;var had=G.ready||G.loading||!!G.err;lsSet('hotlist-gkey',k2);if(had)location.reload();else{closeSheet();ui.tab='map';loadG();render()}}
  else if(a==='refine')refine()
  else if(a==='export')exportData()
  else if(a==='tripbrief')tripBrief()
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetOpen)closeSheet()});
render();loadG();
})();
</script></body></html>
