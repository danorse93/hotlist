*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}

.cats{padding-top:0}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

  '<h2>Or have Claude book it</h2><div class="three"><div><label for="rd">Date</label><input class="f" id="rd" type="date" value="'+today()+'"></div><div><label for="rt">Time</label><select class="f" id="rt">'+times+'</select></div><div><label for="rn">Party</label><input class="f" id="rn" type="number" min="1" value="2"></div></div><div class="acts"><button class="btn red wide" data-act="brief" data-v="'+id+'">Write the booking brief</button></div><div id="briefout"></div>')}
function brief(id){var p=find(id),c=city(),d=$('#rd').value,t=$('#rt').value,n=$('#rn').value||2,ds=d?new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}):'the date I give you';
  var alts=p.ll?c.places.filter(function(q){return q.id!==id&&q.ll&&q.cat===p.cat&&!/Closed/.test(q.chk||'')}).map(function(q){return {q:q,d:dist(p.ll,q.ll)}}).sort(function(a,b){return a.d-b.d}).slice(0,4).map(function(o){return o.q.n}):[];
  var x='Please book me a table at '+p.n.replace(/"/g,'')+(p.ad?' ('+p.ad+', '+c.name+')':' in '+c.name)+' for '+n+' on '+ds+' at around '+t+'. Using your browser, check the restaurant’s own booking page first, then OpenTable, SevenRooms or Resy. If that time has gone, try up to an hour either side.'+(alts.length?' If it’s fully booked, check these nearby places from my hot list instead: '+alts.join(', ')+'.':'')+' Tell me what you find and ask me before you confirm anything or enter card details.';
  $('#briefout').innerHTML='<div class="brief" id="bb">'+esc(x)+'</div><div class="acts"><button class="btn pri" data-act="copy" data-v="bb">Copy brief</button></div><p class="small">Paste it into a chat with Claude. Claude will ask before it commits to anything.</p>';sheet.scrollTop=sheet.scrollHeight}
function form(id){var p=id?find(id):{cat:'dinner'},c=city(),areas=(c.areas||[]).map(function(a){return a.n}),types=TYPES.slice();uniq('ty').forEach(function(t){if(types.indexOf(t[0])<0)types.push(t[0])});
  openSheet('<h3>'+(id?'Edit place':'Add to '+esc(c.name))+'</h3><form id="pf"><label for="fn">Name</label><input class="f" id="fn" required value="'+esc(p.n||'')+'">'+
  '<div class="two"><div><label for="fc">List</label><select class="f" id="fc">'+CATS.map(function(k){return '<option value="'+k[0]+'"'+(p.cat===k[0]?' selected':'')+'>'+esc(k[1])+'</option>'}).join('')+'</select></div><div><label for="fv">Vibe</label><select class="f" id="fv"><option value="">Not set</option>'+VIBES.map(function(v){return '<option value="'+v[0]+'"'+(p.vb===v[0]?' selected':'')+'>'+v[1]+'</option>'}).join('')+'</select></div></div>'+
  '<div class="two"><div><label for="ft">Cuisine type</label><select class="f" id="ft"><option value="">Not set</option>'+types.map(function(t){return '<option'+(p.ty===t?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></div><div><label for="fu">Cuisine detail</label><input class="f" id="fu" placeholder="e.g. Tuscan trattoria" value="'+esc(p.cu||'')+'"></div></div>'+
  '<div class="two"><div><label for="fa">Area</label><input class="f" id="fa" list="fal" value="'+esc(p.ar||'')+'"><datalist id="fal">'+areas.map(function(a){return '<option value="'+esc(a)+'">'}).join('')+'</datalist></div><div><label for="fb">Recommended by</label><input class="f" id="fb" value="'+esc(p.by||'')+'"></div></div>'+
  '<label for="fd">Address</label><input class="f" id="fd" value="'+esc(p.ad||'')+'">'+(G.ready?'<div class="acts"><button type="button" class="btn wide" data-act="findg">Find the address and pin with Google</button></div>':'')+'<p class="small" id="afs">'+(G.ready?'':'With a Google Maps key in Settings, this form can look up the address and pin for you. Until then the pin goes in the middle of the area you pick.')+'</p>'+
  '<label for="fs">Booking link</label><input class="f" id="fs" type="url" placeholder="https://" value="'+esc(p.site||'')+'"><label for="fw">Website (used for the icon)</label><input class="f" id="fw" placeholder="restaurant.com" value="'+esc(p.dom||'')+'"><label for="fo">Your note</label><textarea class="f" id="fo">'+esc(p.note||'')+'</textarea><input type="hidden" id="fll" value="'+(p.ll?p.ll.join(','):'')+'">'+
  '<label class="check" for="fm"><input type="checkbox" id="fm"'+(p.must?' checked':'')+'> Must try</label><div class="acts"><button class="btn pri" type="submit">'+(id?'Save changes':'Add to my list')+'</button></div></form>');
  $('#pf').addEventListener('submit',function(e){e.preventDefault();savePlace(id)})}
function findG(){var name=$('#fn').value.trim(),st=$('#afs'),c=city();if(!name)return;st.textContent='Looking it up…';
  geocode([name,$('#fd').value.trim()||$('#fa').value.trim(),c.name].filter(Boolean).join(', '),function(r){if(!r){st.textContent='Google couldn’t find that. Check the name, or type the address and try again.';return}
    $('#fd').value=r.ad;$('#fll').value=r.ll.join(',');$('#fll').dataset.fresh='1';st.textContent='Pin set from Google. Check the address is the right place.'})}
function savePlace(id){var c=city(),name=$('#fn').value.trim();if(!name)return;var p=id?find(id):{id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36)};
  var oldAr=p.ar;p.n=name;p.cat=$('#fc').value;p.vb=$('#fv').value||undefined;p.ty=$('#ft').value||undefined;p.cu=$('#fu').value.trim();p.ar=$('#fa').value.trim();p.by=$('#fb').value.trim()||undefined;p.ad=$('#fd').value.trim();p.site=$('#fs').value.trim()||undefined;p.note=$('#fo').value.trim()||undefined;p.dom=$('#fw').value.trim()||undefined;p.must=$('#fm').checked||undefined;
  var fresh=$('#fll').dataset.fresh,ll=$('#fll').value.split(',').map(Number);
  if(ll.length===2&&isFinite(ll[0])&&isFinite(ll[1])&&ll[0])p.ll=ll;
  if((!p.ll||(id&&oldAr!==p.ar&&!fresh))&&p.ar){var a=(c.areas||[]).filter(function(x){return x.n.toLowerCase()===p.ar.toLowerCase()})[0];if(a)p.ll=[a.ll[0]+(Math.random()-.5)*.002,a.ll[1]+(Math.random()-.5)*.003]}
  if(id)delete p.chk;else c.places.push(p);
  ui.sel=p.id;ui.cat=ui.ty=ui.vb=ui.ar='all';save();closeSheet();render()}
function settings(){var key=lsGet('hotlist-gkey')||'',state=G.ready?'Live Google map is on.':(G.err||(gKey()?'Loading Google Maps…':'No key yet, so the app is showing the sketch map.'));
  openSheet('<h3>Settings</h3><h2>Google Maps</h2><p class="small" style="margin-top:0">'+esc(state)+'</p>'+(KEY_IN_FILE?'<p class="small">A key is built into this file.</p>':'<label for="gk">Google Maps API key</label><input class="f" id="gk" autocomplete="off" spellcheck="false" value="'+esc(key)+'"><div class="acts"><button class="btn pri" data-act="savekey">Save key and load the map</button></div>')+
  '<ol class="steps"><li>Go to console.cloud.google.com, create a project and add billing.</li><li>Enable “Maps JavaScript API” and “Geocoding API”.</li><li>Create an API key. Under website restrictions, add the address this app is hosted at.</li><li>Paste the key above. It is kept in this browser only.</li></ol>'+
  (G.ready?'<div class="acts"><button class="btn wide" data-act="refine">Correct every pin from its address</button></div><p class="small" id="rfs">My starting pins are approximate. This asks Google for the exact spot of each place that has a street address.</p>':'')+
  '<h2>Restaurant icons</h2><p class="small" style="margin-top:0">'+esc(IC.ok?IC.ok+' icons loaded so far.':(IC.fail?'Icons for places you add yourself load from the web, which previews inside Claude block. The '+Object.keys(ICONS).length+' built-in icons always show.':'No icons requested yet. Scroll the Home or List screen first.'))+'</p><h2>Your location</h2><p class="small" style="margin-top:0">'+esc(ui.me?'Tracking you while the app is open, accurate to about '+Math.round(ui.me[2])+' m.':(geoErr||'Off. Tap Near me on the map and allow location when asked.'))+'</p>'+
  '<h2>Photo credits</h2><p class="small" style="margin-top:0">Cuisine, neighbourhood and vibe photos are from Wikimedia Commons, cropped, under the licence shown.</p><details class="small"><summary>Show all '+Object.keys(PHOTOS).length+' credits</summary>'+Object.keys(PHOTOS).map(function(k){var c=PHOTOS[k];return '<p style="margin-top:6px"><a href="'+esc(c.u)+'" target="_blank" rel="noopener">'+esc(c.t)+'</a>'+(c.by?' by '+esc(c.by):'')+' ('+esc(c.lic)+')</p>'}).join('')+'</details><h2>Backup</h2><p class="small" style="margin-top:0">Your list lives in this browser on this device. Download a backup before clearing browser data or to move it to another device.</p><div class="acts"><button class="btn" data-act="export">Download backup</button><label class="btn" for="imp" style="margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)">Restore backup</label></div><input type="file" id="imp" accept="application/json,.json" hidden>');
  $('#imp').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.cities||!j.cities.length)throw 0;j.rev=Math.max(j.rev||0,S.rev||0);S=j;ui.city=S.cities[0].id;M.city=null;save();closeSheet();render();status('Backup restored')}catch(x){status('That file isn’t a Hot List backup.')}};r.readAsText(f)})}
function refine(){var c=city(),ps=c.places.filter(function(p){return p.ad&&/\d/.test(p.ad)}),i=0,ok=0,st=$('#rfs');
  (function next(){if(i>=ps.length){save();if(st)st.textContent='Done. '+ok+' of '+ps.length+' pins corrected.';if(ui.tab==='map'&&!sheetOpen)render();else if(G.ready)gSync();return}
    var p=ps[i++];if(st)st.textContent='Checking '+i+' of '+ps.length+': '+p.n;
    geocode(p.ad.split('. ')[0].replace(/^Mangal 2: /,'')+', '+c.name,function(r,err){if(r&&dist(r.ll,p.ll||r.ll)<3000){p.ll=r.ll;ok++}if(err==='REQUEST_DENIED'){if(st)st.textContent='Google refused. Enable “Geocoding API” for your key, then try again.';return}setTimeout(next,err==='OVER_QUERY_LIMIT'?1500:250)})})()}
function exportData(){try{var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hot-list-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}catch(e){status('Couldn’t create the backup file.')}}
function cities(){openSheet('<h3>Cities</h3><div style="margin-top:10px">'+S.cities.map(function(c){return '<button class="item plain" data-act="city" data-v="'+c.id+'"><b>'+esc(c.name)+'</b><small>'+c.places.length+' places'+(c.id===ui.city?' · showing now':'')+'</small></button>'}).join('')+'</div><form id="cf"><label for="cn">Start a new city</label><input class="f" id="cn" required placeholder="Paris, Dubai, New York"><div class="acts"><button class="btn pri" type="submit">Add city</button></div></form>');
  $('#cf').addEventListener('submit',function(e){e.preventDefault();var n=$('#cn').value.trim();if(!n)return;var id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36);var c={id:id,name:n,center:null,areas:[],places:[]};S.cities.push(c);ui.city=id;ui.near=null;ui.sel=null;ui.cat=ui.ty=ui.vb=ui.ar='all';save();closeSheet();render();
    geocode(n,function(r){if(r){c.center=r.ll;save();M.city=null;if(ui.city===id)render()}})})}
function copy(id,btn){var t=$('#'+id).textContent;function ok(){btn.textContent='Copied'}function no(){var r=document.createRange();r.selectNodeContents($('#'+id));var s=window.getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected. Press copy'}
  try{navigator.clipboard.writeText(t).then(ok,no)}catch(e){no()}}

/* ---------- events ---------- */
var delArm=null;
app.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,v=t.dataset.v,p;
  if(a==='tab'){ui.tab=v;render()}
  else if(a==='pickf'){ui.cat=ui.ty=ui.vb=ui.ar='all';ui.q='';ui[t.dataset.k]=v;ui.grp='cat';ui.tab='list';render()}
  else if(a==='seeall'){ui.cat=ui.ty=ui.vb=ui.ar='all';ui.grp=v;if(v==='dist')startGeo();ui.tab='list';render()}
  else if(a==='gosearch'){ui.tab='list';render();var qe=$('#q');if(qe)qe.focus()}
  else if(a==='geo'){startGeo();t.querySelector('small').textContent='Finding you… Allow location when your browser asks.'}
  else if(a==='set'){var k=t.dataset.k;ui[k]=ui[k]===v?'all':v;var fs=ui.fs;render();if(fs)filtersSheet()}
  else if(a==='clearf'){ui.cat=ui.ty=ui.vb=ui.ar='all';var f2=ui.fs;render();if(f2)filtersSheet()}
  else if(a==='filters')filtersSheet()
  else if(a==='grp'){ui.grp=v;if(v==='dist')startGeo();render()}
  else if(a==='near'){if(v==='me'){startGeo();ui.near=ui.near==='me'?null:'me'}else{v=+v;ui.near=ui.near===v?null:v}ui.sel=null;vMap();var pt=nearPt();if(pt)goTo(pt.ll,15,2300);else if(ui.near==null){if(G.ready)gView(city());else fit()}}
  else if(a==='pin'){if(moved>8)return;ui.sel=v;layout();tray()}
  else if(a==='zin'||a==='zout'){zoomAt(M.w/2,M.h/2,a==='zin'?1.5:1/1.5);layout()}
  else if(a==='zfit'){ui.near=null;vMap();fit()}
  else if(a==='open')profile(v)
  else if(a==='reserve')reserve(v)
  else if(a==='brief')brief(v)
  else if(a==='copy')copy(v,t)
  else if(a==='close'){closeSheet();if(ui.tab==='map'){if(G.ready)gSel();else layout();tray()}}
  else if(a==='showmap'){p=find(v);closeSheet();ui.tab='map';ui.near=null;ui.cat=ui.ty=ui.vb=ui.ar='all';ui.sel=v;render();goTo(p.ll,16,1500)}
  else if(a==='must'||a==='been'){p=find(v);p[a]=p[a]?undefined:true;save();render();profile(v)}
  else if(a==='edit')form(v)
  else if(a==='add')form(null)
  else if(a==='findg')findG()
  else if(a==='del'){if(delArm!==v){delArm=v;t.textContent='Tap again to remove';return}delArm=null;var c=city();c.places=c.places.filter(function(x){return x.id!==v});ui.sel=null;save();closeSheet();render()}
  else if(a==='cities')cities()
  else if(a==='city'){ui.city=v;ui.near=null;ui.sel=null;ui.cat=ui.ty=ui.vb=ui.ar='all';ui.q='';closeSheet();render()}
  else if(a==='settings')settings()
  else if(a==='savekey'){var k2=$('#gk').value.trim();if(!k2)return;var had=G.ready||G.loading||!!G.err;lsSet('hotlist-gkey',k2);if(had)location.reload();else{closeSheet();ui.tab='map';loadG();render()}}
  else if(a==='refine')refine()
  else if(a==='export')exportData()
  else if(a==='tripbrief')tripBrief()
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetOpen)closeSheet()});
render();loadG();
})();
</script></body></html>
